<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B2FF7"/>
      <stop offset="100%" stop-color="#00BFFF"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00BFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreBlur" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#0B0F19"/>

  <!-- Everything below is grouped and centered around (256,256) -->
  <g transform="translate(256,256)">

    <!-- Rounded-square app icon reference, centered at origin, slight tilt -->
    <g filter="url(#glowSoft)" transform="rotate(-10)">
      <rect x="-64" y="-64" width="128" height="128" rx="32"
            fill="none" stroke="#FFFFFF" stroke-width="13"/>
    </g>

    <!-- Primary orbit arc, centered ring around origin, ~270 degrees of a circle -->
    <g filter="url(#glowStrong)">
      <path d="M -90 84 A 122 122 0 1 1 84 -90"
            fill="none" stroke="url(#ringGrad)" stroke-width="15"
            stroke-linecap="round"/>
    </g>

    <!-- Secondary thinner echo arc, concentric, slightly larger radius -->
    <path d="M -104 118 A 154 154 0 0 0 118 -104"
          fill="none" stroke="url(#ringGrad2)" stroke-width="5"
          stroke-linecap="round" opacity="0.5"/>

    <!-- Glowing node at the arc's leading tip -->
    <circle cx="84" cy="-90" r="28" fill="url(#coreGlow)" filter="url(#coreBlur)"/>
    <circle cx="84" cy="-90" r="10" fill="#FFFFFF"/>
  </g>
</svg>
